# Optional operator overrides for engine/thresholds.py (audit S4f-X).
#
# To activate: copy this file to `config/thresholds.toml` (gitignored) and set only the
# keys you want to change. Anything left out keeps the documented default in
# thresholds.py. Only the SCALAR keys below are overridable — calibrated/frozen constants
# (KELLY_FRACTION, F5_SCALAR, BM_SHRINKAGE_DEFAULT, PLATT_SPACE, BLEND_ALPHA,
# DEFAULT_MARKET_MULT, WNBA_EV_FLOOR, POISSON_CUTOFF, LONGSHOT_PAIR_RHO) and non-scalar
# structures are intentionally NOT overridable and change only via a reviewed code edit.
#
# Values shown are the current defaults. Types must match (int stays int, float float).

