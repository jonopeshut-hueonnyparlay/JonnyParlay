[pytest]
# Audit fix-pass P0.5 (CI bootstrap). Register the `network` marker so CI can run
# `pytest -m "not network"` and future fetcher tests that hit live APIs can be
# marked without an "unknown marker" warning. No test uses it yet (all current
# network-touching tests mock their HTTP layer), so -m "not network" runs the
# full suite today.
markers =
    network: test requires live network access (excluded in CI via -m "not network")
